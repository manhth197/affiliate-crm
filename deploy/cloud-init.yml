#cloud-config
# EC2 user data for Ubuntu Server 24.04 LTS (arm64, e.g. t4g.small).
# Paste this file as "User data" when launching the instance. It:
#   - applies updates and enables automatic security updates,
#   - adds 2 GB of swap (building the images needs more than 2 GB RAM),
#   - installs Docker Engine + Compose plugin from Docker's apt repository,
#   - rotates container logs, installs AWS CLI v2 (for backups to S3),
#   - schedules the daily database backup (deploy/backup.sh) at 01:30 Vietnam time.
# The app itself is deployed by hand afterwards (see docs/deploy/aws.md).

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - git
  - unzip
  - unattended-upgrades

swap:
  filename: /swapfile
  size: 2147483648 # 2 GiB
  maxsize: 2147483648

write_files:
  # Small, rotated container logs so the 20 GB disk never fills up.
  - path: /etc/docker/daemon.json
    permissions: '0644'
    content: |
      {
        "log-driver": "local",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }
  # Daily backup at 18:30 UTC = 01:30 Asia/Ho_Chi_Minh.
  - path: /etc/cron.d/affiliate-crm-backup
    permissions: '0644'
    content: |
      SHELL=/bin/bash
      PATH=/usr/local/bin:/usr/bin:/bin
      30 18 * * * root /opt/affiliate-crm/deploy/backup.sh >> /var/log/affiliate-crm-backup.log 2>&1

runcmd:
  # Docker Engine from the official apt repository.
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >-
    sh -c 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable"
    > /etc/apt/sources.list.d/docker.list'
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker ubuntu
  # AWS CLI v2 (arm64). Credentials come from the instance role, never from files.
  - curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip -o /tmp/awscliv2.zip
  - unzip -q /tmp/awscliv2.zip -d /tmp
  - /tmp/aws/install
  - rm -rf /tmp/aws /tmp/awscliv2.zip
  - mkdir -p /opt/affiliate-crm && chown ubuntu:ubuntu /opt/affiliate-crm

final_message: 'affiliate-crm: base setup done after $UPTIME seconds. Next: clone the repo into /opt/affiliate-crm (docs/deploy/aws.md).'
