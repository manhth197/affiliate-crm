# CI for the NestJS API (apps/api): static checks, unit tests, e2e tests
# against real Postgres + Redis service containers, OpenAPI drift check, and
# a build of both Docker images.
name: api

on:
  workflow_dispatch:
  push:
    branches: [main, dev/api]
    paths:
      - 'apps/api/**'
      - 'docs/openapi.json'
      - 'docker-compose.yml'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'docs/openapi.json'
      - 'docker-compose.yml'
      - '.github/workflows/api.yml'

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, unit and e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: affiliate_crm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crm -d affiliate_crm_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Read by test/test-env.ts; the e2e suite refuses non-*_test databases
      # and Redis database 0.
      TEST_DATABASE_URL: postgresql://crm:crm@localhost:5432/affiliate_crm_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install (also runs prisma generate)
        run: npm ci

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

      - name: e2e tests (migrations applied by the global setup)
        run: npm run test:e2e -- --ci

      - name: docs/openapi.json matches the code
        env:
          # The export boots the app without connecting; config just has to validate.
          DATABASE_URL: postgresql://crm:crm@localhost:5432/affiliate_crm_test
          REDIS_URL: redis://localhost:6379/1
          JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only
        run: |
          npm run openapi:export
          git diff --exit-code -- ../../docs/openapi.json

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Runtime image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          target: runtime
          tags: affiliate-crm-api:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Migrate image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          target: migrate
          tags: affiliate-crm-migrate:ci
          push: false
          cache-from: type=gha
