# CI for the React web app (apps/web): generated API types in sync with the OpenAPI export,
# lint, typecheck, format, unit/integration tests (Vitest + MSW), production build, and a
# build of the nginx Docker image. Runs only when the web (or the API contract) changes.
name: web

on:
  workflow_dispatch:
  push:
    branches: [main, dev/web]
    paths:
      - 'apps/web/**'
      - 'docs/openapi.json'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'docs/openapi.json'
      - '.github/workflows/web.yml'

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Types, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci
        env:
          # The e2e runner uses an installed browser; never download one here.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Generated API types match docs/openapi.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.gen.ts

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

      - name: Unit and integration tests (Vitest + MSW)
        run: npm test

      - name: Production build
        run: npm run build

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: nginx image
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          tags: affiliate-crm-web:ci
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
