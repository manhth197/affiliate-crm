# Affiliate CRM stack.
# Host ports are shifted (5433, 6380) so this stack can run next to other projects.
#   docker compose up -d postgres redis          # infrastructure for local dev
#   JWT_ACCESS_SECRET=... docker compose --profile app up -d --build
#                                                # + migrations, the API and the web app
#   → open http://localhost:8080 (web; nginx also proxies /api and /socket.io to the API)
name: affiliate-crm

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: affiliate_crm
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm -d affiliate_crm']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence so queued BullMQ jobs survive a restart.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6380:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off: applies pending migrations, then exits. Seed demo data with
  #   docker compose --profile app run --rm migrate npx prisma db seed
  migrate:
    profiles: ['app']
    build:
      context: ./apps/api
      target: migrate
    environment:
      DATABASE_URL: postgresql://crm:crm@postgres:5432/affiliate_crm
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ['app']
    build:
      context: ./apps/api
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://crm:crm@postgres:5432/affiliate_crm
      REDIS_URL: redis://redis:6379
      # No default on purpose: the API refuses to start without a 32+ char secret.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # Set to true behind HTTPS (adds Secure to the refresh-token cookie).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # The browser reaches the API through the web container's nginx: one
      # proxy hop, so rate limits use the client IP from X-Forwarded-For.
      TRUST_PROXY: '1'
      PARTNER_WEBHOOKS: ${PARTNER_WEBHOOKS:-[]}
    ports:
      # Loopback only: with TRUST_PROXY=1 a client reaching the API directly
      # could fake X-Forwarded-For, so the public entry point is nginx (8080).
      # Change API_PORT if `npm run start:dev` already uses 3000.
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # React build served by nginx; nginx also proxies /api and /socket.io to the
  # API, so the browser sees one origin (no CORS; the SameSite=Strict refresh
  # cookie just works). Image: apps/web/Dockerfile (crm-web).
  web:
    profiles: ['app']
    build:
      context: ./apps/web
      # Defaults: VITE_API_URL=/api/v1, VITE_SOCKET_URL= (same origin).
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:3000
      NGINX_RESOLVER: 127.0.0.11
      CSP_CONNECT_SRC: ''
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
